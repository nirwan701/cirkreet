[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cirkreet"
version = "0.2.0"
description = "A Python-first toolkit for learning and analysing electronic circuits."
keywords = ["circuit-analysis", "electronics", "SPICE", "KiCad", "MNA", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "nbformat>=5.9"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.0", "nbformat>=5.9", "nbclient>=0.10"]

[project.urls]
Homepage = "https://github.com/nirwan701/cirkreet"
Repository = "https://github.com/nirwan701/cirkreet"
Issues = "https://github.com/nirwan701/cirkreet/issues"

[project.scripts]
cirkreet = "circhecker.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["circhecker*"]

[tool.setuptools.package-data]
circhecker = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: numerically intensive reference tests (run with -m slow)"]

